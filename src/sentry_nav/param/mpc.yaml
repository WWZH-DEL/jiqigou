# ==============================================================================
# ROS APT MPC Local Planner 配置文件
# 适用包: ros-<distro>-mpc-local-planner
# ==============================================================================

# 1. 指定局部规划器插件
base_local_planner: "mpc_local_planner/MpcLocalPlannerROS"

# 控制频率 (必须与 dt 匹配)
controller_frequency: 50.0  # 50Hz

MpcLocalPlannerROS:
  # --------------------------------------------------------------------------
  # 坐标系设置
  # --------------------------------------------------------------------------
  odom_topic: "/odom"              # 请确保话题名正确，有时是 /odom
  global_frame: "robot_foot_init"
  robot_base_frame: "base_foot"       # 请确保 TF 中存在此 frame

  # --------------------------------------------------------------------------
  # 运动学模型 (Kinematics)
  # --------------------------------------------------------------------------
  # 选择一种模型，注释掉另一种
  kinematics: "diff_drive"            # 差速
  # kinematics: "omni_drive"          # 全向 (若支持)
  
  # 差速参数
  track_width: 0.45                   # 轮距 (左右轮距离)
  wheel_radius: 0.08                  # 轮子半径

  # --------------------------------------------------------------------------
  # 机器人约束 (Constraints)
  # --------------------------------------------------------------------------
  # 速度限制
  max_vel_x: 2.0
  min_vel_x: 0.0
  max_vel_theta: 1.0
  min_vel_theta: -1.0

  # 加速度限制
  max_acc_x: 2.0
  max_acc_theta: 1.0

  # --------------------------------------------------------------------------
  # MPC 核心参数 (Solver)
  # --------------------------------------------------------------------------
  N: 5                               # 预测步数 (Horizon)。建议 10-15。若崩溃请降至 5。
  M: 2                                # 控制时域 (Control Horizon)。通常为 2-5。
  dt: 0.02                            # 步长 (1/50Hz = 0.02s)

  # 求解器设置 (防止崩溃的关键)
  max_iter: 50                       # 最大迭代次数
  tolerance: 1e-4                     # 收敛容差

  # --------------------------------------------------------------------------
  # 机器人轮廓 (Footprint)
  # --------------------------------------------------------------------------
  # 大多数 apt 版本使用此格式
  footprint_model:
    type: "polygon"
    vertices: [[-0.5, -0.3], [-0.5, 0.3], [0.5, 0.3], [0.5, -0.3]]

  # # 如果报错找不到 footprint_model，尝试注释上面，使用旧版格式：
  # footprint: [[-0.5, -0.3], [-0.5, 0.3], [0.5, 0.3], [0.5, -0.3]]
  # robot_radius: 0.0                 # 如果使用多边形，设半径为0或注释

  # --------------------------------------------------------------------------
  # 目标容差
  # --------------------------------------------------------------------------
  xy_goal_tolerance: 0.35
  yaw_goal_tolerance: 0.2

  # --------------------------------------------------------------------------
  # 权重矩阵 (Weights - 核心调参)
  # --------------------------------------------------------------------------
  # 状态权重 (Q): 位置、角度、速度
  Q_x: 10.0
  Q_y: 10.0
  Q_theta: 10.0
  Q_v: 1.0
  Q_w: 1.0

  # 控制权重 (R): 加速度 (鼓励平滑)
  R_a: 1.0                            # 线加速度权重
  R_alpha: 2.0                        # 角加速度权重

  # 避障权重
  obstacle_cost_weight: 1000.0        # 障碍物惩罚

  # --------------------------------------------------------------------------
  # 避障与路径跟踪
  # --------------------------------------------------------------------------
  min_obstacle_dist: 0.3              # 最小安全距离
  lookahead_dist: 3.0                 # 跟踪全局路径的前瞻距离

  # --------------------------------------------------------------------------
  # 可视化
  # --------------------------------------------------------------------------
  publish_traj: true
  verbose: false                      # 调试时设为 true 查看内部状态
